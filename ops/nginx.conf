# 8080 = merchant dashboard + public checkout (apps/web)
# 8081 = ops console (apps/admin)
# Both proxy /v1 (and the health probes) to the api on the compose network.
# Same hostname, different ports: cookies are scoped by host, so the admin
# console's impersonation cookie reaches the dashboard.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    root /usr/share/nginx/web;
    client_max_body_size 10m;

    # Checkout and dashboard must not be framed (clickjacking on the pay page).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # The admin API is served from the ops console host only.
    location /v1/admin/ {
        return 404;
    }
    location /v1/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://api:3000;
    }
    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 8081;
    root /usr/share/nginx/admin;
    client_max_body_size 10m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /v1/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
    location / {
        try_files $uri /index.html;
    }
}
