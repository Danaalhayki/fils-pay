# FilsPay stack: Postgres, the three services that talk to it (apps/api,
# apps/settlement, apps/reporting), and nginx serving apps/web + apps/admin.
#
#   cd ops
#   cp .env.example .env        # optional for local; required when hosted
#   docker compose up --build
#   docker compose --profile seed run --rm seed   # demo data (local only)
#
# `migrate` runs before every service starts. `seed` wipes the database, so
# it never runs as part of `up`; it is opt-in through the `seed` profile and
# refuses NODE_ENV=production and non-local databases (db/seed/index.ts).
#
# Settings come from ops/.env (gitignored; see .env.example). Defaults below
# are for a laptop only: NODE_ENV=development, the dev webhook key, and a
# dev internal token. With NODE_ENV=production the api refuses to boot
# without real values for every secret.

name: filspay

x-database-url: &database-url postgres://filspay:${POSTGRES_PASSWORD:-filspay_dev_password}@postgres:5432/filspay?sslmode=disable

x-node-service: &node-service
  build:
    context: ..
    dockerfile: ops/Dockerfile.node
  image: filspay-node:local
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: filspay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filspay_dev_password}
      POSTGRES_DB: filspay
    # Loopback only: the database is never published to the network.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - filspay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filspay -d filspay"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *node-service
    restart: "no"
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *node-service
    restart: "no"
    profiles: ["seed"]
    command: ["npm", "run", "seed"]
    environment:
      DATABASE_URL: *database-url
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *node-service
    # One node process (no npx/tsx wrappers) under tini, so the watchdog in
    # the healthcheck can kill it and SIGTERM reaches the graceful shutdown.
    command: ["sh", "-c", "rm -f /tmp/hc_fail; exec node --import tsx apps/api/src/index.ts"]
    init: true
    # The brief's budget for the api: 0.5 vCPU, 512 MB.
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3000"
      DATABASE_URL: *database-url
      # V8 gives up (and the container restarts) before the cgroup OOM-kills it.
      NODE_OPTIONS: --max-old-space-size=320
      PG_POOL_MAX: ${PG_POOL_MAX:-20}
      OVERLOAD_MAX_IN_FLIGHT: ${OVERLOAD_MAX_IN_FLIGHT:-}
      OVERLOAD_MAX_DB_WAITING: ${OVERLOAD_MAX_DB_WAITING:-}
      OVERLOAD_MAX_EVENT_LOOP_DELAY_MS: ${OVERLOAD_MAX_EVENT_LOOP_DELAY_MS:-}
      # nginx (web service) is one hop; add one per terminator in front of it.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      SETTLEMENT_INTERNAL_URL: http://settlement:8091
      SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN:-dev-internal-token}
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:-}
      ACQUIRER_CALLBACK_SIGNING_SECRET: ${ACQUIRER_CALLBACK_SIGNING_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      OTP_DEV_EXPOSE: ${OTP_DEV_EXPOSE:-}
      CHECKOUT_BASE_URL: ${PUBLIC_WEB_URL:-http://localhost:8080}
      KYC_UPLOAD_DIR: /app/data/kyc
    volumes:
      - kyc_uploads:/app/data/kyc
    # Docker only restarts containers that exit, not ones that hang. Three
    # failed liveness probes in a row kill the node process; tini then exits
    # and `restart: unless-stopped` brings a fresh one up. /healthz never
    # touches the database and is exempt from load shedding, so a busy or
    # DB-starved api is not mistaken for a hung one.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/healthz',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
          && rm -f /tmp/hc_fail
          || { n=$$(( $$(cat /tmp/hc_fail 2>/dev/null || echo 0) + 1 )); echo $$n > /tmp/hc_fail; [ $$n -lt 3 ] || kill -9 -1; exit 1; }
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

  settlement:
    build:
      context: ..
      dockerfile: ops/Dockerfile.go
    restart: unless-stopped
    command: ["./settlement", "daemon"]
    # SIGTERM lets an in-flight batch commit or roll back; the internal API
    # waits up to 30 s for it, so Docker must not SIGKILL at its 10 s default.
    stop_grace_period: 60s
    environment:
      DATABASE_URL: *database-url
      SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN:-dev-internal-token}
    depends_on:
      migrate:
        condition: service_completed_successfully

  reporting:
    <<: *node-service
    command: ["node", "--import", "tsx", "apps/reporting/src/index.ts"]
    init: true
    mem_limit: 256m
    environment:
      DATABASE_URL: *database-url
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: ops/Dockerfile.web
      args:
        PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:8080}
    restart: unless-stopped
    # Loopback unless the operator opts in: the admin console must not be on
    # the public network by accident. Publish through an https terminator
    # (ops/DEPLOY.md), or set e.g. WEB_PORT=0.0.0.0:8080 deliberately.
    ports:
      - "${WEB_PORT:-127.0.0.1:8080}:8080"
      - "${ADMIN_PORT:-127.0.0.1:8081}:8081"
    depends_on:
      api:
        condition: service_healthy

  # TLS terminator for a hosted box: `docker compose --profile https up -d`
  # with SITE_HOST set (ops/DEPLOY.md). Off by default so a laptop `up`
  # never tries to obtain certificates.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    mem_limit: 128m
    environment:
      SITE_HOST: ${SITE_HOST:-}
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started

volumes:
  filspay_pgdata:
  kyc_uploads:
  caddy_data:
  caddy_config:
